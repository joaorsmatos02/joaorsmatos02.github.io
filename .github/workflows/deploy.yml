name: Build and Deploy

on:
  push:
    branches: [testing]

permissions:
  contents: read
  pages: write
  id-token: write

# Pinned dependency versions — bump these here to update the DOOM build.
env:
  DWASM_REF: ddf0347a4fc115b11ffb1c5710768b7c47c46698   # GMH-Code/Dwasm commit
  EMSDK_VERSION: "3.1.64"                                # emscripten-core/emsdk
  FREEDOOM_VERSION: "0.13.0"                             # freedoom/freedoom release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dwasm
        run: |
          rm -rf assets/doom/Dwasm
          git init -q assets/doom/Dwasm
          cd assets/doom/Dwasm
          git remote add origin https://github.com/GMH-Code/Dwasm.git
          git fetch -q --depth 1 origin "$DWASM_REF"
          git checkout -q FETCH_HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3 python3-pip unzip wget curl pkg-config libsdl2-dev libsdl2-mixer-dev libpng-dev zlib1g-dev

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Fetch Freedoom IWAD
        run: |
          mkdir -p assets/doom/Dwasm/wasm/fs
          url="https://github.com/freedoom/freedoom/releases/download/v${FREEDOOM_VERSION}/freedoom-${FREEDOOM_VERSION}.zip"
          echo "Downloading Freedoom ${FREEDOOM_VERSION} from ${url}"
          curl -L -o /tmp/freedoom.zip "$url"
          unzip -j /tmp/freedoom.zip "*freedoom1.wad" -d assets/doom/Dwasm/wasm/fs
          ls -lh assets/doom/Dwasm/wasm/fs

      - name: Build native prboomx.wad
        run: |
          cd assets/doom/Dwasm
          mkdir -p build_native && cd build_native
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          cp prboomx.wad ../wasm/fs/

      - name: Build Dwasm WebAssembly
        run: |
          source /tmp/emsdk/emsdk_env.sh
          cd assets/doom/Dwasm
          mkdir -p build && cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          cp index.* ../wasm/

      - name: Prepare site
        run: |
          mkdir public
          cp -r *.html assets public/
          touch public/.nojekyll
          find public -type d -name .git -prune -exec rm -rf {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
