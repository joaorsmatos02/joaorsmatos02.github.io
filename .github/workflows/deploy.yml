name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3 python3-pip unzip wget curl pkg-config libsdl2-dev libsdl2-mixer-dev libpng-dev zlib1g-dev

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          pushd /tmp/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          popd
          echo "EMSDK=/tmp/emsdk" >> $GITHUB_ENV
          echo "PATH=/tmp/emsdk/upstream/emscripten:/tmp/emsdk/node/14.20.0_64bit:$PATH" >> $GITHUB_ENV

      - name: Fetch Freedoom IWAD
        run: |
          mkdir -p assets/doom/Dwasm/wasm/fs
          latest=$(curl -sL https://api.github.com/repos/freedoom/freedoom/releases/latest | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"])')
          version=${latest#v}
          url="https://github.com/freedoom/freedoom/releases/download/${latest}/freedoom-${version}.zip"
          echo "Downloading Freedoom release ${latest} from ${url}"
          curl -L -o /tmp/freedoom.zip "$url"
          unzip -j /tmp/freedoom.zip "*freedoom1.wad" -d assets/doom/Dwasm/wasm/fs
          ls -lh assets/doom/Dwasm/wasm/fs

      - name: Build native prboomx.wad
        run: |
          pushd assets/doom/Dwasm
          mkdir -p build_native
          cd build_native
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cp prboomx.wad ../wasm/fs/
          popd

      - name: Build Dwasm WebAssembly
        run: |
          pushd assets/doom/Dwasm
          source /tmp/emsdk/emsdk_env.sh
          mkdir -p build
          cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cp index.* ../wasm/
          popd

      - name: Prepare site
        run: |
          mkdir public
          cp -r *.html assets public/
          touch public/.nojekyll
          find public -type d -name .git -prune -exec rm -rf {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4